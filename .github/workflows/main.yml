name: CI

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - name: Set up xprintidle repo
        uses: actions/checkout@v7
      - name: Install clang-format
        run: sudo apt-get install -y clang-format
      - name: Check formatting
        run: git ls-files '*.c' '*.h' | xargs clang-format --dry-run --Werror

  build:
    runs-on: ubuntu-latest
    steps:
      - name: Install deps
        run: sudo apt-get install libxss-dev
      - name: Set up xprintidle repo
        uses: actions/checkout@v7
      - name: Set up python
        uses: actions/setup-python@v7
        with:
          python-version: '3.14'
      - name: Set up meson
        run: python -m pip install meson==1.12.1 ninja
      - name: Configure xprintilde
        run: meson setup --fatal-meson-warnings -Dwerror=true builddir
      - name: Compile xprintilde
        run: meson compile -C builddir/
